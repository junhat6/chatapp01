name: Validate Runbooks

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**.md'
      - 'docs/**/**.md'
      - 'scripts/validate-runbooks.mjs'
      - 'scripts/validate-runbooks.sh'
  push:
    branches: [ main ]
    paths:
      - 'docs/**.md'
      - 'docs/**/**.md'
      - 'scripts/validate-runbooks.mjs'
      - 'scripts/validate-runbooks.sh'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate runbooks
        run: |
          chmod +x scripts/validate-runbooks.sh || true
          ./scripts/validate-runbooks.sh 